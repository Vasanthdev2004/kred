<figure style="margin:0;padding:28px;background:#ffffff;color:#0f1720;font-family:'Segoe UI',Inter,system-ui,sans-serif;">
<svg viewBox="0 0 1480 1120" role="img" aria-label="Kred architecture: a client either pays an invoice through Arc's Memo contract or commits the funds to KredEscrow and releases them as work is delivered; Kred's database stores only tags and which transactions a disclosure reveals, never amounts; an assistant reads the same indexed data and can only propose, never write; and the public verify page recomputes every figure live from Arc receipts while reading the anchor and revocation state from KredRegistry." style="max-width:100%;height:auto;display:block;">

  <text x="0" y="24" class="b" style="font-size:21px">Kred — invoice, escrow, and verifiable proof-of-income on Arc</text>
  <text x="0" y="48" class="s">A payment carries its own invoice context onchain. The database never holds an amount, so a verifier recomputes every figure from Arc itself.</text>

  <!-- ============ BAND 2 ============ -->

  <text x="872" y="853" class="s" text-anchor="middle">one-way · no PII onchain</text>

  <text x="302" y="1016" class="s" text-anchor="middle">EURC never summed</text>

  <text x="592" y="958" class="b" text-anchor="middle">recompute()</text>

  <text x="592" y="998" class="s" text-anchor="middle">receipt from Arc and re-adds</text>
  <text x="592" y="1016" class="s" text-anchor="middle">the totals from scratch</text>

  <line class="ln" x1="136" y1="980" x2="170" y2="980" marker-end="url(#a)"/>

  <line class="ln" x1="0" y1="1078" x2="1480" y2="1078" stroke-opacity=".18"/>
  <text x="0" y="1102" class="s">Next.js 14 App Router · wagmi/viem · Prisma + Postgres · deployed on Railway at kred.today</text>
  <text x="1480" y="1102" class="b" text-anchor="end" style="fill:#0E9F6E">Green = onchain. The chain is the source of truth.</text>
</svg>
<figcaption style="margin-top:18px;font-size:13.5px;line-height:1.55;opacity:.78;max-width:1220px;">
  A client can settle an invoice immediately through Arc's Memo contract, or commit the funds to KredEscrow and release them as work is delivered — either way the invoice context travels with the payment, so the record is created at settlement rather than reconstructed afterwards. Kred's database stores only tags and which transactions a disclosure reveals, never an amount. The assistant reads that same indexed data and can only propose; every write goes through the user. When a verifier opens a proof link, each figure is recomputed from Arc receipts on the spot and the anchor and revocation state are read from KredRegistry, so nothing on the page depends on trusting Kred.
</figcaption>
</figure>
